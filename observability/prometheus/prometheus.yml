global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 2s

scrape_configs:
  - job_name: astralog-brokers
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - host.docker.internal:9201
        labels:
          broker: "1"
      - targets:
          - host.docker.internal:9202
        labels:
          broker: "2"
      - targets:
          - host.docker.internal:9203
        labels:
          broker: "3"

name: AstraLog CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Immutable checkout revision (v4.2.2); no moving action branches.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # Use the pinned rust-toolchain.toml without an unpinned setup action.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features --locked -- --test-threads=1

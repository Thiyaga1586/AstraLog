name: AstraLog CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Immutable checkout revision (v5.0.1, Node.js 24); no moving action branches.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      # Use the pinned rust-toolchain.toml without an unpinned setup action.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Run the historically intermittent RF3/group failover gate before the
      # 16-minute interview benchmarks so a genuine regression fails promptly.
      # The following full suite still executes all tests without exclusions.
      - name: P6 failover integration (fast-fail)
        run: cargo test -p astralog-broker --test p6_routing --all-features --locked -- --test-threads=1
      - name: Tests
        run: cargo test --workspace --all-features --locked -- --test-threads=1

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard/web
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Node version
        run: node --version
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Typecheck and build dashboard
        run: npm run build
      - name: Test dashboard data contracts
        run: npm test
